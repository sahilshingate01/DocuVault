<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Shield Outline -->
  <path d="M256 32 C340 96 448 96 448 96 C448 304 352 420 256 480 C160 420 64 304 64 96 C64 96 172 96 256 32 Z" 
        fill="url(#shieldGrad)" 
        stroke="#60a5fa" 
        stroke-width="8" 
        filter="url(#shadow)"/>

  <!-- Inner Protective Shield Geometry -->
  <path d="M256 70 C322 120 410 120 410 120 C410 286 332 384 256 438 C180 384 102 286 102 120 C102 120 190 120 256 70 Z" 
        fill="#0b0f19" 
        opacity="0.85"
        stroke="#3b82f6" 
        stroke-width="4"/>

  <!-- Cryptographic Node Nodes / Circuit Tracks -->
  <circle cx="256" cy="190" r="14" fill="#10b981" />
  <circle cx="190" cy="280" r="12" fill="#3b82f6" />
  <circle cx="322" cy="280" r="12" fill="#3b82f6" />
  <circle cx="256" cy="350" r="14" fill="#8b5cf6" />

  <!-- Connecting Hash-Chain Links -->
  <line x1="256" y1="190" x2="190" y2="280" stroke="#60a5fa" stroke-width="4" stroke-dasharray="6,4" />
  <line x1="256" y1="190" x2="322" y2="280" stroke="#60a5fa" stroke-width="4" stroke-dasharray="6,4" />
  <line x1="190" y1="280" x2="256" y2="350" stroke="#60a5fa" stroke-width="4" stroke-dasharray="6,4" />
  <line x1="322" y1="280" x2="256" y2="350" stroke="#60a5fa" stroke-width="4" stroke-dasharray="6,4" />

  <!-- Central DigiLocker Padlock Icon -->
  <rect x="220" y="240" width="72" height="56" rx="10" fill="#f8fafc" />
  <path d="M236 240 V216 A20 20 0 0 1 276 216 V240" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="265" r="6" fill="#1e293b" />
  <line x1="256" y1="271" x2="256" y2="282" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
</svg>
